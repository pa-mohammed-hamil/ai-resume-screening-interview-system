[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


# ============================================================
# Project Metadata
# ============================================================

[project]
name = "ai-resume-screening-interview-system"
version = "0.1.0"
description = "AI-powered resume screening, candidate matching, ranking, and adaptive interview platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }

authors = [
    { name = "[Your Name]" }
]

keywords = [
    "ai",
    "recruitment",
    "resume-screening",
    "resume-parser",
    "ats",
    "candidate-ranking",
    "job-matching",
    "generative-ai",
    "rag",
    "interview-ai",
    "nlp",
    "machine-learning"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries"
]

dependencies = [
    # --------------------------------------------------------
    # Web API
    # --------------------------------------------------------
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",

    # --------------------------------------------------------
    # Configuration / Validation
    # --------------------------------------------------------
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",

    # --------------------------------------------------------
    # Database
    # --------------------------------------------------------
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",

    # --------------------------------------------------------
    # Authentication / Security
    # --------------------------------------------------------
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.2,<5.0",
    "python-multipart>=0.0.9,<1.0",

    # --------------------------------------------------------
    # Background Tasks
    # --------------------------------------------------------
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",

    # --------------------------------------------------------
    # Resume Parsing
    # --------------------------------------------------------
    "pypdf>=5.0,<6.0",
    "python-docx>=1.1,<2.0",

    # --------------------------------------------------------
    # NLP
    # --------------------------------------------------------
    "spacy>=3.8,<4.0",
    "nltk>=3.9,<4.0",

    # --------------------------------------------------------
    # Data / Machine Learning
    # --------------------------------------------------------
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.14,<2.0",

    # --------------------------------------------------------
    # Embeddings / Semantic Search
    # --------------------------------------------------------
    "sentence-transformers>=3.0,<6.0",

    # --------------------------------------------------------
    # Generative AI
    # --------------------------------------------------------
    "openai>=1.50,<3.0",

    # --------------------------------------------------------
    # HTTP / External APIs
    # --------------------------------------------------------
    "httpx>=0.27,<1.0",

    # --------------------------------------------------------
    # File / Document Utilities
    # --------------------------------------------------------
    "python-magic>=0.4,<1.0",

    # --------------------------------------------------------
    # AWS / Object Storage
    # --------------------------------------------------------
    "boto3>=1.35,<2.0",

    # --------------------------------------------------------
    # Monitoring
    # --------------------------------------------------------
    "prometheus-client>=0.20,<1.0",

    # --------------------------------------------------------
    # Logging
    # --------------------------------------------------------
    "structlog>=24.4,<26.0",

    # --------------------------------------------------------
    # Environment
    # --------------------------------------------------------
    "python-dotenv>=1.0,<2.0"
]


# ============================================================
# Optional Dependencies
# ============================================================

[project.optional-dependencies]

# Development tools
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<5.0",
    "types-redis>=4.6,<5.0"
]

# Production server
production = [
    "gunicorn>=23.0,<24.0"
]

# Voice interview support
voice = [
    "openai>=1.50,<3.0"
]

# RAG / vector database support
rag = [
    "chromadb>=0.5,<1.0"
]

# Development + all optional AI features
all = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<5.0",
    "types-redis>=4.6,<5.0",
    "gunicorn>=23.0,<24.0",
    "chromadb>=0.5,<1.0"
]


# ============================================================
# CLI Entry Points
# ============================================================

[project.scripts]
ai-recruiter = "backend.app.main:main"


# ============================================================
# Setuptools Package Discovery
# ============================================================

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backend*",
    "ai*",
    "genai*",
    "interview_engine*"
]

exclude = [
    "tests*",
    "data*",
    "storage*",
    "frontend*",
    "screenshots*"
]


# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests"
]

python_files = [
    "test_*.py",
    "*_test.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short"
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "evaluation: AI/model evaluation tests",
    "slow: Slow-running tests",
    "asyncio: Async tests"
]

asyncio_mode = "auto"

filterwarnings = [
    "error",
    "ignore::DeprecationWarning"
]


# ============================================================
# Coverage
# ============================================================

[tool.coverage.run]

branch = true

source = [
    "backend",
    "ai",
    "genai",
    "interview_engine"
]

omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py"
]


[tool.coverage.report]

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload"
]

show_missing = true

fail_under = 70


# ============================================================
# Ruff
# ============================================================

[tool.ruff]

line-length = 100

target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "migrations"
]


[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "C4"
]

ignore = [
    "E501"
]


[tool.ruff.lint.isort]

known-first-party = [
    "backend",
    "ai",
    "genai",
    "interview_engine"
]


# ============================================================
# Mypy
# ============================================================

[tool.mypy]

python_version = "3.11"

check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

ignore_missing_imports = true

exclude = [
    "^tests/",
    "^migrations/"
]


# ============================================================
# Alembic
# ============================================================

[tool.alembic]

# Migration configuration is normally kept in:
# alembic.ini
#
# This section documents the expected migration directory.

script_location = "backend/app/database/migrations"


# ============================================================
# Formatting / Tooling
# ============================================================

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false


# ============================================================
# Development Dependency Groups
# ============================================================

[dependency-groups]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<5.0"
]
