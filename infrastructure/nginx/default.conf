# ============================================================
# AI Resume Screening & Interview System
# Nginx Default Server Configuration
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # ========================================================
    # Frontend SPA
    # ========================================================

    location / {
        try_files $uri $uri/ /index.html;
    }


    # ========================================================
    # Backend API
    # ========================================================

    location /api/ {

        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;

        proxy_send_timeout 120s;

        proxy_read_timeout 120s;
    }


    # ========================================================
    # WebSocket
    # Used for real-time AI / voice interviews
    # ========================================================

    location /ws/ {

        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;

        proxy_send_timeout 3600s;
    }


    # ========================================================
    # FastAPI Swagger Documentation
    # ========================================================

    location /docs {

        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================================================
    # FastAPI ReDoc
    # ========================================================

    location /redoc {

        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================================================
    # OpenAPI Schema
    # ========================================================

    location /openapi.json {

        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================================================
    # File Uploads
    # ========================================================

    client_max_body_size 50M;

    client_body_timeout 120s;


    # ========================================================
    # Static Assets
    # ========================================================

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {

        expires 7d;

        add_header Cache-Control
            "public, max-age=604800";
    }


    # ========================================================
    # Security Headers
    # ========================================================

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Referrer-Policy
        "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy
        "camera=(), microphone=(self), geolocation=()" always;


    # ========================================================
    # Disable access to hidden files
    # ========================================================

    location ~ /\. {
        deny all;
    }
}