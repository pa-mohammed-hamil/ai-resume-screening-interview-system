# Project scaffold file
# ================================================================
# ALEMBIC CONFIGURATION
# AI Resume Screening & Interview System
# ================================================================

[alembic]

# Path to migration scripts.
script_location = backend/app/database/migrations

# Template used when creating new migration files.
# file_template = %%(rev)s_%%(slug)s

# Revision path separator.
# Use OS path separator.
path_separator = os

# Timezone used for migration timestamps.
# timezone =

# Maximum length of generated migration slug.
truncate_slug_length = 40

# Run environment during revision creation.
revision_environment = false

# Sourceless migrations.
sourceless = false

# Version location.
# version_locations = %(here)s/backend/app/database/migrations/versions

# Version path separator.
version_path_separator = os

# Output encoding.
output_encoding = utf-8


# ================================================================
# DATABASE
# ================================================================

# The actual DATABASE_URL is loaded from app/core/config.py
# inside migrations/env.py.
#
# Keeping this placeholder prevents credentials from being
# committed to Git.

sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/resume_ai


# ================================================================
# LOGGING
# ================================================================

[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S